name: Tests

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
        working-directory: backend

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: docker/setup-buildx-action@v3
      - name: Cache backend Python dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Build backend container image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/soundroom-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save backend image as build artifact
        run: docker save "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/soundroom-backend:${GITHUB_SHA}" --output backend-image.tar
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: soundroom-build
          path: |
            frontend/dist/
            backend-image.tar
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: soundroom-build
          path: |
            frontend/dist/
            backend-image.tar

  vercel-build:
    name: Prepare Vercel production artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: soundroom-build
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global vercel
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: vercel-prebuilt
          path: .vercel/output/
          include-hidden-files: true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: pip install -r backend/requirements-dev.txt
      - run: npm test
        working-directory: frontend
      - run: mkdir -p coverage
        working-directory: backend
      - run: pytest --cov=app --cov-report=xml:coverage/backend-coverage.xml
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage
          path: |
            frontend/coverage/
            backend/coverage/backend-coverage.xml
          if-no-files-found: ignore

  deploy:
    name: Deploy Vercel frontend and Render backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.lint.result == 'success' && needs.frontend-lint.result == 'success' && needs.build.result == 'success' && needs.test.result == 'success' && needs.vercel-build.result == 'success'
    needs: [lint, frontend-lint, build, test, vercel-build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.VERCEL_SITE_URL }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vercel-prebuilt
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: soundroom-build
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global vercel
      - run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Publish backend image built by the build job
        run: docker load --input backend-image.tar && docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/soundroom-backend:${GITHUB_SHA}"
      - name: Trigger Render backend deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --show-error --silent -X POST "$RENDER_DEPLOY_HOOK_URL"
